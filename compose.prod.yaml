# Trend Detective — production stack.
#
# Runs PREBUILT images from GHCR. Nothing is built on the VM.
# The deploy script exports BACKEND_IMAGE and FRONTEND_IMAGE as immutable
# references, e.g. ghcr.io/owner/repo/backend:sha-abc1234
#
#   docker compose -f compose.prod.yaml config --quiet
#   docker compose -f compose.prod.yaml pull
#   docker compose -f compose.prod.yaml up -d --no-build

name: trend-detective-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required (immutable ghcr reference)}
    environment:
      # The backend rejects APP_ENV=production until real science + auth land
      # (app/core/config.py guard). "staging" is the highest accepted value.
      APP_ENV: ${APP_ENV:-staging}
      MOCK_MODE: ${MOCK_MODE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/v1}
      JOB_BACKEND: ${JOB_BACKEND:-inline}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Optional: only read when JOB_BACKEND=database
      DATABASE_URL: ${DATABASE_URL:-}
    # Published on loopback only; Nginx reaches it over the internal network.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    networks:
      - prod-net

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required (immutable ghcr reference)}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      - prod-net

networks:
  prod-net:
    driver: bridge

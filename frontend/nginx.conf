server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache, content-hashed filenames from Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API surface is served by the backend container (service name: backend).
    # /v1, /health, /docs, /redoc and /openapi.json are proxied verbatim so
    # no prefix is stripped and the OpenAPI docs keep working.
    location ~ ^/(v1|health|ready|docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Single-page app fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the shell document.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}

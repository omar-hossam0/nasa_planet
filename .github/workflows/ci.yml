name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build - compile Python sources
        run: python -m compileall -q app

      - name: Validate runtime catalog JSON
        working-directory: .
        run: python -m json.tool data/nasa/runtime_catalog.json > /dev/null

      - name: Run test suite
        run: python -m pytest

  rag:
    name: RAG (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.13'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Build - compile RAG sources
        shell: bash
        run: |
          python -m compileall -q data/nasa/rag
          if [ -d packages/rag ]; then
            python -m compileall -q packages/rag
          fi

      - name: Validate RAG data files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rag_root = Path("data/nasa/rag")
          json_files = sorted(rag_root.rglob("*.json"))
          for path in json_files:
              json.loads(path.read_text(encoding="utf-8"))

          jsonl_files = sorted(rag_root.rglob("*.jsonl"))
          jsonl_records = 0
          for path in jsonl_files:
              for line_number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      json.loads(line)
                      jsonl_records += 1

          print(f"Validated {len(json_files)} JSON files and {jsonl_records} JSONL records")
          PY

      - name: Run offline RAG retrieval smoke test
        run: python data/nasa/rag/retrieve.py "soil moisture"

      - name: Run RAG evaluation tests when present
        shell: bash
        run: |
          test_targets=()
          if [ -d tests/rag ]; then
            test_targets+=(tests/rag)
          fi
          for test_file in tests/test_phase*.py; do
            if [ -e "$test_file" ]; then
              test_targets+=("$test_file")
            fi
          done
          if [ ${#test_targets[@]} -gt 0 ]; then
            python -m pytest "${test_targets[@]}"
          else
            echo "No packages/rag evaluation suite in this branch; baseline smoke tests passed."
          fi

  ai-ml:
    name: AI/ML evaluation (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install AI/ML test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Build - compile AI/ML and backend sources
        run: python -m compileall -q ai backend/app packages/rag

      - name: Run AI/ML evaluation
        run: python ai/evaluate.py

  statistics:
    name: Statistics package (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/science/requirements.txt

      - name: Install statistics dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt pulls requirements-audit.txt (numpy/xarray/netCDF4) + scipy.
          # pytest is needed by test_gaussian_ar1_inference.py, which imports it directly.
          python -m pip install -r packages/science/requirements.txt pytest

      - name: Build - compile statistics sources
        run: python -m compileall -q packages/science/src

      - name: Run statistics test suite
        timeout-minutes: 20
        run: python -m unittest discover -s packages/science/tests -v

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker build and compose smoke test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose configuration
        run: |
          docker compose config --quiet
          docker compose -f compose.ci.yaml config --quiet

      - name: Build images
        run: docker compose -f compose.ci.yaml build

      - name: Start stack
        run: docker compose -f compose.ci.yaml up -d --wait --wait-timeout 180

      - name: Smoke test - backend health and OpenAPI
        run: |
          docker compose -f compose.ci.yaml exec -T backend python - <<'PY'
          import json, sys, urllib.request

          def get(path):
              with urllib.request.urlopen(f"http://127.0.0.1:8000{path}", timeout=10) as response:
                  return response.status, json.loads(response.read())

          status, health = get("/health")
          assert status == 200, status
          print("health:", health.get("status"))

          status, spec = get("/openapi.json")
          assert status == 200, status
          assert len(spec["paths"]) >= 10, len(spec["paths"])
          print("openapi paths:", len(spec["paths"]))
          PY

      - name: Smoke test - mock analysis workflow
        run: |
          docker compose -f compose.ci.yaml exec -T backend python - <<'PY'
          import json, sys, urllib.request

          base = "http://127.0.0.1:8000"

          def post(path, payload):
              request = urllib.request.Request(
                  base + path,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.status, json.loads(response.read())

          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  return response.status, json.loads(response.read())

          payload = {
              "variable_ids": ["air_temperature"],
              "region_id": "nile_corridor",
              "start_month": "2005-01",
              "end_month": "2020-12",
          }
          status, created = post("/v1/analyses", payload)
          assert status in (200, 201, 202), status
          job_id = created["job_id"]
          print("job:", job_id, created.get("status"))

          status, job = get(f"/v1/analyses/{job_id}")
          assert status == 200, status
          print("job state:", job.get("status"))

          result_id = job.get("result_id")
          assert result_id, "completed job must expose a result_id"
          status, result = get(f"/v1/results/{result_id}")
          assert status == 200, status
          assert result.get("data_mode") == "mock", result.get("data_mode")
          print("result:", result_id, "mode:", result.get("data_mode"))
          PY

      - name: Smoke test - frontend and API proxy
        run: |
          docker compose -f compose.ci.yaml exec -T frontend sh -c '
            wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
            echo "frontend index: ok"
            wget -q -O /dev/null http://backend:8000/health || exit 1
            echo "frontend -> backend service name: ok"
          '

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f compose.ci.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f compose.ci.yaml down --remove-orphans --volumes

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    # Only the trusted main branch may publish deployable artifacts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend
      - rag
      - ai-ml
      - statistics
      - frontend
      - docker
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve image prefix (lowercase)
        id: meta
        run: |
          echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest

      - name: Publish summary
        run: |
          {
            echo "### Images published"
            echo ""
            echo "- \`${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: publish-images
    # Deployment is impossible unless every required CI job passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ vars.AZURE_VM_HOST }}
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    env:
      APP_DIR: /opt/trend-detective
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}
      IMAGE_TAG: sha-${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SSH identity
        env:
          SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
          EXPECTED_FINGERPRINT: ${{ vars.AZURE_VM_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY}" ]; then echo "AZURE_VM_SSH_KEY secret is not set"; exit 1; fi
          if [ -z "${VM_HOST}" ]; then echo "AZURE_VM_HOST variable is not set"; exit 1; fi
          PORT="${VM_PORT:-22}"

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Pinned host identity: scan, then require the expected SHA256 fingerprint.
          ssh-keyscan -p "${PORT}" -T 10 "${VM_HOST}" > ~/.ssh/scanned_hosts 2>/dev/null
          if [ ! -s ~/.ssh/scanned_hosts ]; then echo "host key scan returned nothing"; exit 1; fi

          if [ -n "${EXPECTED_FINGERPRINT}" ]; then
            if ! ssh-keygen -lf ~/.ssh/scanned_hosts -E sha256 | awk '{print $2}' | grep -qx "${EXPECTED_FINGERPRINT}"; then
              echo "SSH host key fingerprint mismatch for ${VM_HOST}"
              ssh-keygen -lf ~/.ssh/scanned_hosts -E sha256
              exit 1
            fi
            echo "host key fingerprint verified"
          else
            echo "AZURE_VM_HOST_FINGERPRINT is not set; refusing to continue without host verification"
            exit 1
          fi

          # Keep only the verified keys, normalised for the target host.
          ssh-keygen -H -f ~/.ssh/scanned_hosts >/dev/null 2>&1 || true
          cp ~/.ssh/scanned_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 -o BatchMode=yes \
              "${VM_USER:-azureuser}@${VM_HOST}" \
              'echo "connected as $(whoami) on $(hostname)"; docker --version; docker compose version'

      - name: Ship release configuration
        env:
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
        run: |
          set -euo pipefail
          tar czf - compose.prod.yaml scripts/deploy \
            | ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "${VM_USER:-azureuser}@${VM_HOST}" \
                "mkdir -p ${APP_DIR} && tar xzf - -C ${APP_DIR} && chmod +x ${APP_DIR}/scripts/deploy/*.sh"

      - name: Provide registry credentials (optional)
        env:
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GHCR_TOKEN}" ]; then
            echo "No GHCR_READ_TOKEN secret; relying on public package visibility."
            exit 0
          fi
          printf 'GHCR_USER=%s\nGHCR_TOKEN=%s\n' "${GHCR_USER:-${{ github.actor }}}" "${GHCR_TOKEN}" \
            | ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "${VM_USER:-azureuser}@${VM_HOST}" \
                "umask 077 && cat > ${APP_DIR}/.registry.env"

      - name: Deploy
        env:
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${VM_USER:-azureuser}@${VM_HOST}" \
              "cd ${APP_DIR} && IMAGE_PREFIX='${IMAGE_PREFIX}' IMAGE_TAG='${IMAGE_TAG}' ./scripts/deploy/deploy.sh"

      - name: Collect logs on failure
        if: failure()
        env:
          VM_HOST: ${{ vars.AZURE_VM_HOST }}
          VM_USER: ${{ vars.AZURE_VM_USER }}
          VM_PORT: ${{ vars.AZURE_VM_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${VM_PORT:-22}" \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "${VM_USER:-azureuser}@${VM_HOST}" \
              "cd ${APP_DIR} && docker compose -f compose.prod.yaml ps && docker compose -f compose.prod.yaml logs --no-color --tail 150" || true

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- tag: \`${IMAGE_TAG}\`"
            echo "- result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
